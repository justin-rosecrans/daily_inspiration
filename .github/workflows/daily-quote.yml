name: Daily Inspirational Quote

on:
  schedule:
    # Runs every day at 13:00 UTC (7:00 AM CST / 8:00 AM CDT)
    - cron: "0 13 * * *"
  workflow_dispatch: # Allows you to trigger a test run manually from the Actions tab
  push:
    branches:
      - main

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Inspirational Quote with Ollama
        id: ollama
        uses: ai-action/ollama-action@v2
        with:
          model: qwen3:4b
          cache: true
          prompt: |
            Generate one short, original, deeply inspiring quote for the day.
            Include a brief 1-sentence reflection on how to apply it today.
            IMPORTANT: Do NOT repeat any phrases or sentences. Each sentence must be unique.
            Keep the quote to 1-2 sentences maximum. Keep the reflection to exactly 1 sentence.
            Return your response in this exact format with no other text:

            QUOTE: [your inspiring quote here - no repetition]
            REFLECTION: [your 1-sentence reflection here - no repetition]

      - name: Create Email Body
        id: email
        run: |
          # Save the response to a temporary file
          cat > response.txt << 'RESPONSE'
          ${{ steps.ollama.outputs.response }}
          RESPONSE

          # Parse quote and reflection from the response using sed
          sed -n 's/^QUOTE:\s*//p' response.txt > quote.txt
          sed -n 's/^REFLECTION:\s*//p' response.txt > reflection.txt

          # Generate today's date in the format "Day, MM-DD-YYYY"
          TODAY_DATE=$(date '+%A, %m-%d-%Y')

          # Create the email template
          cat > email.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <body style="margin: 0; padding: 0; background-color: #f3f5fa; font-family: Arial, sans-serif;">
              <table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #f3f5fa;">
                <tr>
                  <td align="center" style="padding: 40px 16px;">
                    <table role="presentation" style="width: 100%; max-width: 560px; border-collapse: collapse; background-color: #ffffff;">
                      <tr>
                        <td style="padding: 36px 32px; border-top: 5px solid #6d63c8;">
                          <table style="width: 100%; border-collapse: collapse;">
                            <tr>
                              <td style="text-align: left;">
                                <p style="margin: 0 0 24px; font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #6d63c8;">Daily Inspiration</p>
                              </td>
                              <td style="text-align: right;">
                                <p style="margin: 0 0 24px; font-size: 12px; color: #8a94a6;">TODAY_DATE_PLACEHOLDER</p>
                              </td>
                            </tr>
                          </table>
                          
                          <h3 style="margin: 0 0 16px 0; font-size: 14px; font-weight: bold; color: #2d3748;">Quote of the Day</h3>
                          <p style="margin: 0 0 24px 0; font-size: 16px; font-style: italic; color: #4a5568; line-height: 1.6;">QUOTE_PLACEHOLDER</p>
                          
                          <h3 style="margin: 24px 0 16px 0; font-size: 14px; font-weight: bold; color: #2d3748;">Reflection of the Day</h3>
                          <p style="margin: 0 0 24px 0; font-size: 14px; color: #4a5568; line-height: 1.6;">REFLECTION_PLACEHOLDER</p>
                          
                          <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">
                          <p style="margin: 0; font-size: 11px; color: #cbd5e0; text-align: center;">This message was generated by an AI. For feedback or concerns, please reach out.</p>
                        </td>
                      </tr>
                    </table>
                    <p style="margin: 20px 0 0; font-size: 12px; color: #8a94a6;">A little inspiration for your day.</p>
                  </td>
                </tr>
              </table>
            </body>
          </html>
          EOF

          # Replace date placeholder
          sed -i "s~TODAY_DATE_PLACEHOLDER~$TODAY_DATE~g" email.html
          
          # Replace quote and reflection using sed with file input (avoids escaping issues)
          sed -i '/QUOTE_PLACEHOLDER/{r quote.txt
          d
          }' email.html
          
          sed -i '/REFLECTION_PLACEHOLDER/{r reflection.txt
          d
          }' email.html

          # Output multi-line HTML using GitHub Actions EOF format
          echo "html_content<<HTMLEOF" >> $GITHUB_OUTPUT
          cat email.html >> $GITHUB_OUTPUT
          echo "HTMLEOF" >> $GITHUB_OUTPUT

      - name: Send Quote via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Your Daily Inspiration"
          to: ${{ secrets.MAIL_TO }}
          from: "Daily Spark <${{ secrets.MAIL_USERNAME }}>"
          html_body: ${{ steps.email.outputs.html_content }}
